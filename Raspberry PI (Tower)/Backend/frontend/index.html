<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fire Ranger Frontend</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <script src="js/config.js"></script>
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div>
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="reports.html">Reports</a>
      <a href="alerts.html">Alerts</a>
    </div>
    <button onclick="toggleDarkMode()" class="btn btn-sm btn-warning">🌙 Toggle Dark Mode</button>
  </div>

  <!-- Main content -->
  <div class="container text-center">
    <h1>🔥 Fire Ranger Dashboard</h1>
    <p class="lead">Your real-time monitoring system</p>

    <!-- Live YOLO feed -->
    <div class="card">
      <h2>🎥 Live YOLO Feed</h2>
      <img src="/video" id="yoloFeed" width="1280" height="720" style="border-radius:8px; border:3px solid orange;">
    </div>

    <!-- Live status card -->
    <div class="card">
      <h2>📡 System Status</h2>
      <p id="status">Loading status...</p>
    </div>
  </div>

  <footer class="text-center mt-5">
    <p>© FireGuardX | Made by Robo-Sapiens</p>
  </footer>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    async function fetchStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        document.getElementById("status").innerHTML =
          `🌡 Temp: ${data.temperature} °C | 💧 Humidity: ${data.humidity}% | 🔥 Fire: ${data.fireDetected ? "YES" : "NO"}`;
      } catch (err) {
        document.getElementById("status").innerHTML = "Error fetching status.";
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 5000); 
  </script>
</body>
</html>
