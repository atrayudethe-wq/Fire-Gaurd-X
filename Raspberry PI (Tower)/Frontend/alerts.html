<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>System Alerts - FireGuardX</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    .flashing-card { animation: flash 1.5s infinite; }
  </style>
</head>
<body>
  <div class="navbar">
    <div>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="reports.html">📑 Reports</a>
      <a href="alerts.html">🚨 Alerts</a>
      <a href="about.html">🧑‍🤝‍🧑 About</a>
    </div>
    <div style="display:flex; align-items:center; gap: 15px;">
      <span id="system-clock" style="color: #ccc; font-size: 14px;"></span>
      <button onclick="toggleTheme()" style="background:none; border:none; color:#ffc107; cursor:pointer; font-weight:bold; font-size: 16px;">🌙 Theme</button>
    </div>
  </div>

  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="color: #dc3545; margin: 0;">🚨 Critical Event Log</h2>
      <button onclick="clearAcknowledged()" style="padding: 8px 15px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Clear Acknowledged</button>
    </div>
    <div id="alertsContainer" style="margin-top: 20px;"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/alerts.js"></script>
</body>
</html>
